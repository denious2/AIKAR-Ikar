        body { margin: 0; background: #000; overflow: hidden; }
        #root { position: absolute; width: 1080px; height: 1920px; overflow: hidden; }
        .composition-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .fullscreen-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; opacity: 0;
        }
        
        /* БАЗОВЫЕ СТИЛИ ОВЕРЛЕЕВ ИЗ БИБЛИОТЕКИ */

        <div id="host-audio" data-composition-id="audio_scene" class="composition-layer clip" data-in="0" data-out="78" data-start="0" data-duration="78" data-track-index="-1" data-composition-src="compositions/audio_scene.html"></div>
        <div id="host-visuals-bg" data-composition-id="visuals_bg_scene" class="composition-layer clip global-shake-active" style="mix-blend-mode: multiply; z-index: 10;" data-in="0" data-out="78" data-start="0" data-duration="78" data-track-index="1" data-composition-src="compositions/visuals_bg_scene.html"></div>
        <div id="host-images" data-composition-id="images_scene" class="composition-layer clip global-shake-active" style="z-index: 20;" data-in="0" data-out="78" data-start="0" data-duration="78" data-track-index="2" data-composition-src="compositions/images_scene.html"></div>
        <div id="host-visuals-fg" data-composition-id="visuals_fg_scene" class="composition-layer clip global-shake-active" style="mix-blend-mode: multiply; z-index: 30;" data-in="0" data-out="78" data-start="0" data-duration="78" data-track-index="3" data-composition-src="compositions/visuals_fg_scene.html"></div>
        <div id="host-dust" data-composition-id="dust_scene" class="composition-layer clip global-shake-active" style="mix-blend-mode: multiply; z-index: 90;" data-in="0" data-out="78" data-start="0" data-duration="78" data-track-index="4" data-composition-src="compositions/dust_scene.html"></div>
        <div id="host-beats" data-composition-id="beats_scene" class="composition-layer clip" style="mix-blend-mode: multiply; z-index: 95; pointer-events: none;" data-in="0" data-out="78" data-start="0" data-duration="78" data-track-index="45" data-composition-src="compositions/beats_scene.html"></div>
        
        <div id="shadow-crush-overlay" class="fullscreen-overlay clip" data-in="0" data-out="78" data-start="0" data-duration="78"></div>
        <div id="screen-flash-overlay" class="fullscreen-overlay clip" data-in="0" data-out="78" data-start="0" data-duration="78"></div>
        
        
        <div id="host-color-grade" class="composition-layer clip" style="z-index: 9998; pointer-events: none; background-color: #100b20; mix-blend-mode: color; opacity: 0.3;" data-in="0" data-out="78" data-start="0" data-duration="78" data-track-index="6"></div>

        
        <!-- 4.6 АКЦЕНТЫ -->
        <div id="host-accents" data-composition-id="accents_scene" class="composition-layer clip" style="z-index: 9999; pointer-events: none; mix-blend-mode: screen;" data-in="0" data-out="78" data-start="0" data-duration="78" data-track-index="46" data-composition-src="compositions/accents_scene.html"></div>
        
        <!-- ГЛОБАЛЬНЫЙ ФИЛЬТР (Intro (Пробуждение)) -->
        <div id="global-filter-0" class="composition-layer clip" style="z-index: 9999; pointer-events: none; backdrop-filter: contrast(120%) brightness(96%) sepia(8%) hue-rotate(-2deg) saturate(105%); mix-blend-mode: multiply;" data-in="0" data-out="9.530" data-start="0.000" data-duration="9.530" data-track-index="10"></div>

        <!-- ГЛОБАЛЬНЫЙ ФИЛЬТР (Hook (В небе)) -->
        <div id="global-filter-2" class="composition-layer clip" style="z-index: 9999; pointer-events: none; backdrop-filter: contrast(110%) brightness(125%) sepia(2%) saturate(100%); mix-blend-mode: multiply;" data-in="0" data-out="5.000" data-start="39.000" data-duration="5.000" data-track-index="10"></div>

        <!-- ГЛОБАЛЬНЫЙ ФИЛЬТР (Outro (Падение)) -->
        <div id="global-filter-4" class="composition-layer clip" style="z-index: 9999; pointer-events: none; backdrop-filter: contrast(120%) brightness(96%) sepia(8%) hue-rotate(-2deg) saturate(105%); mix-blend-mode: multiply;" data-in="0" data-out="14.000" data-start="60.000" data-duration="14.000" data-track-index="10"></div>

    </div>
    <script>
        window.__timelines = window.__timelines || {};
        window.__timelines["root_scene"] = document.querySelector('[data-composition-id="root_scene"]');
    </script>
</body>
</html>
